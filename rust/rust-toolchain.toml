# native_toolchain_rust requires an exact channel, and refuses to build for a
# target that is not listed here. Consumers cannot edit this file once the
# package is in their pub cache, so the list has to cover every platform the
# package claims to support.
[toolchain]
channel = "1.95.0"
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
